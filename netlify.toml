[build]
  command = "hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.166.0"

[[redirects]]
  from = "/historia"
  to = "/historia.html"
  status = 301

[[redirects]]
  from = "/historia/"
  to = "/historia.html"
  status = 301

[[redirects]]
  from = "/Ebook"
  to = "/publicacoes/e-book-contabilidade-do-terceiro-setor-para-leigos/"
  status = 301